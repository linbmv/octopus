name: Quality Gate

env:
  ACTIONLINT_VERSION: v1.7.12
  DEADCODE_VERSION: v0.48.0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GITLEAKS_VERSION: v8.30.1
  GOLANGCI_LINT_VERSION: v2.12.2
  GOVULNCHECK_VERSION: v1.6.0
  STATICCHECK_VERSION: '2026.1'
  TRIVY_VERSION: v0.70.0

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions: {}

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-static:
    name: Go static analysis and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.5'

      - name: Install pinned Go analysis tools
        run: |
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
          go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
          go install "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}"
          go install "golang.org/x/tools/cmd/deadcode@${DEADCODE_VERSION}"
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"

      - name: Go lint and workflow validation
        run: |
          go mod verify
          golangci-lint run --timeout=5m ./...
          staticcheck ./...
          deadcode -test ./...
          actionlint

      - name: Go vulnerability scan
        run: govulncheck ./...

      - name: Go vet
        run: go vet ./...

      - name: Go build
        run: go build ./...

  go-test:
    name: Go race tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.5'

      - name: Go race tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          file: ./coverage.out
          fail_ci_if_error: false

  frontend-container:
    name: Frontend tests and reusable container inputs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.5'

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: '9.15.9'

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify frontend source
        working-directory: web
        run: |
          pnpm run lint
          pnpm run type-check
          pnpm run test

      - name: Build amd64 and arm64 container inputs once
        run: bash scripts/build.sh container

      - name: Frontend Browser E2E
        working-directory: web
        env:
          GOCACHE: ${{ runner.temp }}/octopus-e2e-go-build
          NEXT_TELEMETRY_DISABLED: '1'
          OCTOPUS_E2E_SKIP_BUILD: '1'
          OCTOPUS_E2E_USE_PACKAGED_STATIC: '1'
        run: pnpm run test:e2e

      - name: Validate reusable container inputs
        run: |
          set -euo pipefail
          test "$(find build/docker -type f | wc -l)" -eq 5
          test -f build/docker/SHA256SUMS
          test -f build/docker/SOURCE_COMMIT
          test -f build/docker/VERSION
          test -f build/docker/linux/amd64/octopus
          test -f build/docker/linux/arm64/octopus
          test "$(cat build/docker/SOURCE_COMMIT)" = "${GITHUB_SHA}"
          if grep -q -- '-dirty$' build/docker/VERSION; then
            echo "Refusing dirty container inputs" >&2
            exit 1
          fi
          (cd build/docker && sha256sum --check --strict SHA256SUMS)
          test "$(od -An -tx1 -j18 -N2 build/docker/linux/amd64/octopus | tr -d ' \n')" = 3e00
          test "$(od -An -tx1 -j18 -N2 build/docker/linux/arm64/octopus | tr -d ' \n')" = b700

      - name: Upload Playwright failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-playwright-results
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload verified container inputs
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dev-container-inputs-${{ github.sha }}
          path: build/docker/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  database-matrix:
    name: MySQL 8.0 and PostgreSQL 17 integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:8.0.46
        env:
          MYSQL_ROOT_PASSWORD: octopus-ci-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -poctopus-ci-root"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: octopus-ci-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.5'

      - name: Create disposable source and restore databases
        run: |
          set -euo pipefail
          mysql_id="$(docker ps --filter ancestor=mysql:8.0.46 --format '{{.ID}}')"
          postgres_id="$(docker ps --filter ancestor=postgres:17.6 --format '{{.ID}}')"
          test -n "${mysql_id}"
          test -n "${postgres_id}"
          docker exec "${mysql_id}" mysql -uroot -poctopus-ci-root -e 'CREATE DATABASE octopus_source; CREATE DATABASE octopus_target;'
          docker exec "${postgres_id}" psql -v ON_ERROR_STOP=1 -U postgres -c 'CREATE DATABASE octopus_source;' -c 'CREATE DATABASE octopus_target;'

      - name: Test MySQL matrix
        env:
          OCTOPUS_TEST_DB_TYPE: mysql
          OCTOPUS_TEST_DB_SOURCE_DSN: 'root:octopus-ci-root@tcp(127.0.0.1:3306)/octopus_source?charset=utf8mb4&parseTime=True&loc=UTC'
          OCTOPUS_TEST_DB_TARGET_DSN: 'root:octopus-ci-root@tcp(127.0.0.1:3306)/octopus_target?charset=utf8mb4&parseTime=True&loc=UTC'
        run: |
          set -euo pipefail
          mkdir -p build/database-evidence
          go test -json -count=1 ./internal/op -run '^TestDatabaseMatrix$' |
            tee build/database-evidence/mysql.jsonl

      - name: Test PostgreSQL matrix
        env:
          OCTOPUS_TEST_DB_TYPE: postgres
          OCTOPUS_TEST_DB_SOURCE_DSN: 'host=127.0.0.1 user=postgres password=octopus-ci-postgres dbname=octopus_source port=5432 sslmode=disable TimeZone=UTC'
          OCTOPUS_TEST_DB_TARGET_DSN: 'host=127.0.0.1 user=postgres password=octopus-ci-postgres dbname=octopus_target port=5432 sslmode=disable TimeZone=UTC'
        run: |
          set -euo pipefail
          go test -json -count=1 ./internal/op -run '^TestDatabaseMatrix$' |
            tee build/database-evidence/postgres.jsonl

      - name: Upload database matrix evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: database-matrix-results
          path: build/database-evidence/
          if-no-files-found: error
          retention-days: 14

  supply-chain:
    name: Secret and source security gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout complete history
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.5'

      - name: Install pinned Gitleaks
        env:
          GOBIN: ${{ runner.temp }}/security-tools
        run: |
          go install "github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}"
          echo "${GOBIN}" >>"${GITHUB_PATH}"

      - name: Scan current tree and complete Git history
        id: secret_scan
        continue-on-error: true
        env:
          GITLEAKS_ENFORCE_HISTORY: 'false'
        run: scripts/security/scan-secrets.sh build/security

      - name: Scan source dependencies and deployment configuration
        id: source_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: sarif
          output: build/security/trivy-source.sarif
          limit-severities-for-sarif: true
          skip-dirs: build,static/out,web/.next,web/node_modules
          timeout: 15m

      - name: Upload redacted security reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-security-reports
          path: build/security/
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce supply-chain gate
        if: ${{ always() }}
        env:
          SECRET_SCAN_RESULT: ${{ steps.secret_scan.outcome }}
          SOURCE_SCAN_RESULT: ${{ steps.source_scan.outcome }}
        run: |
          set -euo pipefail
          test "${SECRET_SCAN_RESULT}" = success
          test "${SOURCE_SCAN_RESULT}" = success

  quality-gate:
    name: Quality Gate
    if: ${{ always() }}
    needs:
      - go-static
      - go-test
      - frontend-container
      - database-matrix
      - supply-chain
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Enforce every quality gate
        env:
          DATABASE_RESULT: ${{ needs.database-matrix.result }}
          FRONTEND_CONTAINER_RESULT: ${{ needs.frontend-container.result }}
          GO_STATIC_RESULT: ${{ needs.go-static.result }}
          GO_TEST_RESULT: ${{ needs.go-test.result }}
          SUPPLY_CHAIN_RESULT: ${{ needs.supply-chain.result }}
        run: |
          set -euo pipefail
          test "${GO_STATIC_RESULT}" = success
          test "${GO_TEST_RESULT}" = success
          test "${FRONTEND_CONTAINER_RESULT}" = success
          test "${DATABASE_RESULT}" = success
          test "${SUPPLY_CHAIN_RESULT}" = success
