# Octopus 健康系统配置示例

health:
  # 是否启用健康系统
  enabled: true

  # 超时参数
  timeout:
    min: 5s              # 最小超时
    max: 40s             # 最大超时
    default: 15s         # 默认超时（降级时使用）
    cold_start: 20s      # 冷启动超时（新渠道）
    min_samples: 30      # 启用自适应超时的最小样本数

  # CV（变异系数）阈值
  cv_thresholds:
    stable: 0.3          # 稳定渠道阈值 (CV < 0.3)
    moderate: 0.8        # 中等抖动阈值 (0.3 <= CV < 0.8)

  # 超时乘数
  multipliers:
    stable: 1.10         # 稳定渠道: P95 × 1.10
    moderate: 1.30       # 中等抖动: P95 × 1.30
    high_jitter: 1.50    # 高抖动: P95 × 1.50

  # 健康度评分参数
  scoring:
    window_size: 50                 # 滑动窗口大小
    min_score: 0.05                 # 最小健康度评分
    fast_recovery_threshold: 5      # 快速恢复阈值（连续成功次数）
    fast_recovery_score: 0.5        # 快速恢复目标分数

  # 贝叶斯先验
  prior:
    success: 7.0         # 先验成功数
    total: 10.0          # 先验总数
    min_samples: 10      # 使用后验的最小样本数

  # 失败样本权重
  weights:
    timeout_sample: 1.0  # 超时样本权重（关键参数）
    network_error: 0.5   # 网络错误权重

  # 持久化配置
  persistence:
    enabled: true
    data_dir: ./data/health
    interval: 5m         # 持久化间隔
    max_snapshots: 10    # 最大快照数量

  # Estimator 配置
  estimator:
    type: tdigest        # tdigest 或 histogram
    compression: 100     # T-Digest 压缩率

  # 灰度配置（Phase 5）
  rollout:
    enabled: false       # 是否启用灰度
    percentage: 10       # 流量百分比 (0-100)
    channels: []         # 灰度渠道白名单（空 = 全部）
    observation_mode: true  # 仅观测不干预

# Prometheus 指标配置
metrics:
  enabled: true
  namespace: octopus     # 指标命名空间
  update_interval: 30s   # 指标更新间隔

# HTTP API 配置
api:
  enabled: true
  base_path: /health     # API 基础路径
